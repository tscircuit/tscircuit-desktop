<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tscircuit viewer</title>
    <style>
      html,
      body,
      #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <!--
      tscircuit desktop: the page the Circuit tab frames. `setup` puts RunFrame
      with its eval worker (runframe.min.js, from the tscircuit package) and
      manifold-3d (viewer-assets.js) beside this file, as viewer.json names.

      RunFrame evaluates the project's circuit code, so this page never runs in
      the app's origin. The desktop app serves it on a host of its own. In a
      browser the frame's sandbox takes its origin away, and then it cannot
      fetch files, keep storage, or start a module worker: hence the blob URL
      and the stand-ins below. See apps/web/src/tscircuit/viewerFrame.ts.
    -->
    <div id="root"></div>
    <script src="./viewer-assets.js"></script>
    <script src="./playback.js"></script>
    <script>
      (() => {
        const assets = self.TSCIRCUIT_VIEWER_ASSETS ?? {};
        delete self.TSCIRCUIT_VIEWER_ASSETS;
        // Read by the script below that prices a board for the Order pane.
        self.TSCIRCUIT_DESKTOP_JLCPCB_QUOTE_VERSION = assets.versions?.jlcpcbQuote ?? null;

        // RunFrame's bundle expects Node's `process` to exist.
        globalThis.process ??= { env: {}, version: "" };

        // A page without an origin may not touch storage: even reading `localStorage`
        // throws. RunFrame only keeps conveniences there, so memory will do.
        const memoryStorage = () => {
          const items = new Map();
          return {
            get length() {
              return items.size;
            },
            key: (index) => [...items.keys()][index] ?? null,
            getItem: (key) => (items.has(key) ? items.get(key) : null),
            setItem: (key, value) => void items.set(String(key), String(value)),
            removeItem: (key) => void items.delete(key),
            clear: () => items.clear(),
          };
        };
        for (const name of ["localStorage", "sessionStorage"]) {
          try {
            void window[name];
          } catch {
            Object.defineProperty(window, name, { configurable: true, value: memoryStorage() });
          }
        }

        // The 3D view rotates the board by itself until told otherwise, and keeps that
        // choice here. Start it still, unless the user switched rotation on in its menu.
        if (localStorage.getItem("cadViewerAutoRotateUserToggled") !== "true") {
          localStorage.setItem("cadViewerAutoRotate", "false");
        }

        // Take props from the app, as runframe.tscircuit.com/iframe.html does.
        window.TSCIRCUIT_USE_RUNFRAME_PROPS_FROM_PARENT = true;
        // The eval worker is the one inside RunFrame's bundle, so there is no version to choose or look up.
        window.TSCIRCUIT_ALLOW_SELECTING_EVAL_VERSION = false;
        if (assets.versions?.eval) window.TSCIRCUIT_LATEST_EVAL_VERSION = assets.versions.eval;
        // The app's usage analytics are off, and RunFrame's own would report from inside it.
        window.TSCIRCUIT_TELEMETRY_DISABLED = true;

        const blobUrl = (content, type = "text/javascript") =>
          URL.createObjectURL(new Blob([content], { type }));

        // RunFrame starts the eval worker as a module, from a blob. Chromium refuses
        // that in a page without an origin, but lets a classic worker import the same
        // blob. The stand-in keeps the messages that arrive before the module listens.
        const classicWorkerThatImports = (moduleUrl) =>
          blobUrl(`
            const early = [];
            const keep = (event) => early.push(event);
            self.addEventListener("message", keep);
            import(${JSON.stringify(moduleUrl)}).then(
              () => {
                self.removeEventListener("message", keep);
                for (const { data, ports } of early) {
                  self.dispatchEvent(new MessageEvent("message", { data, ports: [...ports] }));
                }
              },
              (error) => setTimeout(() => { throw error; }),
            );
          `);
        if (self.origin === "null") {
          const NativeWorker = window.Worker;
          window.Worker = class Worker extends NativeWorker {
            constructor(url, options) {
              const fromBlob = options?.type === "module" && String(url).startsWith("blob:");
              if (fromBlob) {
                super(classicWorkerThatImports(String(url)), { ...options, type: "classic" });
              } else super(url, options);
            }
          };
        }

        // RunFrame's 3D viewer uses this in place of the copy it would import from a CDN.
        if (assets.manifoldJs && assets.manifoldWasmBase64) {
          window.MANIFOLD_MODULE = async () => {
            const wasmBinary = Uint8Array.from(atob(assets.manifoldWasmBase64), (c) =>
              c.charCodeAt(0),
            );
            const { default: createManifold } = await import(blobUrl(assets.manifoldJs));
            // locateFile keeps manifold from resolving its .wasm against a blob URL, which throws.
            return createManifold({ wasmBinary, locateFile: (path) => path });
          };
        }

        // An autorouter bug report needs what the autorouter was given: the Simple Route
        // JSON on each "autorouting:start" event of the run. RunFrame listens for those
        // on its eval worker, which it keeps in `globalThis.runFrameWorker`, and tells a
        // page around it nothing of them. So its listeners are wrapped here: this page
        // keeps each phase's input, tells the app which phases the run had, and hands
        // one input over when the app asks. See apps/web/src/tscircuit/autorouterPhases.ts.
        const PHASE_FIELDS = [
          "subcircuit_id",
          "componentDisplayName",
          "phaseName",
          "routingPhaseIndex",
          "phaseOrdinal",
          "phaseCount",
          "phaseStageIndex",
          "phaseStageCount",
          "connectionCount",
          "obstacleCount",
          "isReroutePhase",
          "autorouterName",
          "solverName",
        ];
        const PHASE_STATUS = {
          "autorouting:start": "running",
          "autorouting:end": "complete",
          "autorouting:error": "error",
        };
        let runCount = 0;
        let phases = [];
        const phaseInputs = new Map();
        const tellApp = (message) => window.parent?.postMessage(message, "*");
        const tellPhases = () => tellApp({ tscircuit_desktop_type: "autorouter_phases", phases });
        const sameUnlessMissing = (a, b) => a === undefined || b === undefined || a === b;
        // The app draws each routed board or group from this, so that two boards without
        // names can be told apart. A thinned copy: a routing problem can hold thousands of pads.
        const MAX_PREVIEW_ITEMS = 500;
        const thinned = (list) => {
          const step = Math.ceil(list.length / MAX_PREVIEW_ITEMS);
          return step <= 1 ? list : list.filter((_, index) => index % step === 0);
        };
        const previewOf = (simpleRouteJson) => {
          const { bounds, layerCount, outline, obstacles } = simpleRouteJson;
          if (typeof bounds !== "object" || bounds === null) return undefined;
          return {
            bounds: { minX: bounds.minX, maxX: bounds.maxX, minY: bounds.minY, maxY: bounds.maxY },
            layerCount,
            outline: Array.isArray(outline)
              ? thinned(outline).map((point) => [point?.x, point?.y])
              : undefined,
            pads: Array.isArray(obstacles)
              ? thinned(obstacles.filter((obstacle) => obstacle?.center)).map((obstacle) => [
                  obstacle.center.x,
                  obstacle.center.y,
                  obstacle.width,
                  obstacle.height,
                ])
              : [],
          };
        };
        const recordPhaseEvent = (name, event) => {
          if (typeof event !== "object" || event === null) return;
          if (name === "autorouting:start") {
            const phase = { id: `run${runCount}-phase${phases.length + 1}`, status: "running" };
            for (const field of PHASE_FIELDS) {
              if (event[field] !== undefined && event[field] !== null) phase[field] = event[field];
            }
            if (event.simpleRouteJson) {
              phaseInputs.set(phase.id, event.simpleRouteJson);
              phase.preview = previewOf(event.simpleRouteJson);
            }
            phases = [...phases, phase];
          } else {
            // The newest running phase of the same group that the event does not contradict.
            const phase = phases.findLast(
              (candidate) =>
                candidate.status === "running" &&
                candidate.subcircuit_id === event.subcircuit_id &&
                sameUnlessMissing(candidate.phaseOrdinal, event.phaseOrdinal) &&
                sameUnlessMissing(candidate.phaseStageIndex, event.phaseStageIndex),
            );
            if (!phase) return;
            const ended = { ...phase, status: PHASE_STATUS[name] };
            if (typeof event.error?.message === "string") ended.errorMessage = event.error.message;
            phases = phases.map((candidate) => (candidate === phase ? ended : candidate));
          }
          tellPhases();
        };
        const tappedWorkers = new WeakSet();
        const tapWorker = (worker) => {
          if (typeof worker !== "object" || worker === null || tappedWorkers.has(worker)) return;
          const { on, executeWithFsMap } = worker;
          if (typeof on !== "function" || typeof executeWithFsMap !== "function") return;
          tappedWorkers.add(worker);
          worker.on = (name, listener) =>
            on.call(
              worker,
              name,
              name in PHASE_STATUS
                ? (event) => {
                    // A fault in the report's bookkeeping must not reach RunFrame's own listener.
                    try {
                      recordPhaseEvent(name, event);
                    } catch (error) {
                      console.error(error);
                    }
                    return listener(event);
                  }
                : listener,
            );
          worker.executeWithFsMap = (...args) => {
            runCount += 1;
            phases = [];
            phaseInputs.clear();
            tellPhases();
            return executeWithFsMap.apply(worker, args);
          };
          self.tscircuitDesktopTapPlayback?.(worker);
        };
        let runFrameWorker = globalThis.runFrameWorker;
        Object.defineProperty(globalThis, "runFrameWorker", {
          configurable: true,
          enumerable: true,
          get: () => runFrameWorker,
          set: (worker) => {
            runFrameWorker = worker;
            tapWorker(worker);
          },
        });
        window.addEventListener("message", (event) => {
          if (event.source !== window.parent) return;
          const message = event.data;
          if (message?.tscircuit_desktop_type !== "get_autorouter_phase_input") return;
          tellApp({
            tscircuit_desktop_type: "autorouter_phase_input",
            request_id: message.request_id,
            simple_route_json: phaseInputs.get(message.phase_id) ?? null,
          });
        });
      })();
    </script>
    <!--
      Makes the files a board is ordered with, and estimates what JLCPCB
      charges for it, for the Order pane (apps/web/src/tscircuit/OrderPanel.tsx).
      The pane asks by message and gets text and numbers back; it does the
      zipping, the saving and the display itself.

      This runs here, in the viewer's origin, because the converters are fetched
      from a CDN when they are first needed, as RunFrame's own export menu
      fetches them, and code from a CDN must stay out of the app's origin.
    -->
    <script>
      (() => {
        const REQUEST_TYPE = "get_order_output";
        const RESPONSE_TYPE = "order_output";

        // The quote package ships TypeScript with no build, which jscdn cannot
        // serve as a module. esm.sh builds it from the repository, at the
        // version `setup` recorded (viewer.json), or the newest without one.
        const JLCPCB_QUOTE = "@tscircuit/circuit-json-to-jlcpcb-quote";
        const quoteVersion = self.TSCIRCUIT_DESKTOP_JLCPCB_QUOTE_VERSION;
        const JLCPCB_QUOTE_URLS = [
          `https://esm.sh/gh/tscircuit/circuit-json-to-jlcpcb-quote${quoteVersion ? `@v${quoteVersion}` : ""}`,
        ];

        /** For the converters RunFrame also loads: the same addresses, in the same order. */
        const converterUrls = (name) =>
          name === JLCPCB_QUOTE
            ? JLCPCB_QUOTE_URLS
            : [`https://jscdn.tscircuit.com/${name}/latest/+esm`, `https://esm.run/${name}`];

        /** RunFrame keeps the converters it has loaded here under these names, so each is fetched once. */
        const loadConverter = async (name) => {
          const loaded = (globalThis.tscircuitDynamicModules ??= {});
          if (Object.hasOwn(loaded, name)) return loaded[name];
          let lastError;
          for (const url of converterUrls(name)) {
            try {
              const converter = await import(url);
              loaded[name] = converter;
              return converter;
            } catch (error) {
              lastError = error;
            }
          }
          throw lastError;
        };

        /**
         * Each returns what the reply carries. Files are a map of path to text,
         * made with the options of RunFrame's "Fabrication Files".
         */
        const makers = {
          gerbers: async (circuitJson) => {
            const { convertCircuitJsonToGerberFiles } =
              await loadConverter("circuit-json-to-gerber");
            // An error or a warning is an element too, and not one that can be manufactured.
            const board = circuitJson.filter(
              (element) => !("error_type" in element) && !("warning_type" in element),
            );
            return { files: convertCircuitJsonToGerberFiles(board, { flip_y_axis: false }) };
          },
          bom: async (circuitJson) => {
            const { convertCircuitJsonToBomRows, convertBomRowsToCsv } =
              await loadConverter("circuit-json-to-bom-csv");
            const rows = await convertCircuitJsonToBomRows({ circuitJson });
            return { files: { "bom.csv": await convertBomRowsToCsv(rows) } };
          },
          pick_and_place: async (circuitJson) => {
            const { convertCircuitJsonToPickAndPlaceCsv } =
              await loadConverter("circuit-json-to-pnp-csv");
            const csv = await convertCircuitJsonToPickAndPlaceCsv(circuitJson, {
              supplier: "jlcpcb",
            });
            return { files: { "pick_and_place.csv": csv } };
          },
          kicad_project: async (circuitJson, projectName) => {
            const {
              CircuitJsonToKicadPcbConverter,
              CircuitJsonToKicadProConverter,
              CircuitJsonToKicadSchConverter,
            } = await loadConverter("circuit-json-to-kicad");
            const output = (converter) => {
              converter.runUntilFinished();
              return converter.getOutputString();
            };
            const files = {
              [`${projectName}.kicad_sch`]: output(new CircuitJsonToKicadSchConverter(circuitJson)),
              [`${projectName}.kicad_pcb`]: output(
                new CircuitJsonToKicadPcbConverter(circuitJson, { projectName }),
              ),
              [`${projectName}.kicad_pro`]: output(
                new CircuitJsonToKicadProConverter(circuitJson, {
                  projectName,
                  schematicFilename: `${projectName}.kicad_sch`,
                  pcbFilename: `${projectName}.kicad_pcb`,
                }),
              ),
            };
            return { files };
          },
          // JLCPCB's smallest order, which is the package's default: 5 boards, 2 of them assembled.
          jlcpcb_quote: async (circuitJson) => {
            const { convertCircuitJsonToJlcpcbQuote } = await loadConverter(JLCPCB_QUOTE);
            const hasParts = circuitJson.some((element) => element.type === "pcb_component");
            const quote = await convertCircuitJsonToJlcpcbQuote({
              circuitJson,
              assembly: hasParts ? "auto" : "none",
              // A part JLCPCB cannot be asked for is left out and named, so the rest still gets a price.
              unresolvedParts: "exclude",
            });
            return {
              quote: {
                order: quote.order,
                summary: quote.summary,
                excluded_designators: quote.excludedBomLines.flatMap(
                  (entry) => entry.line.designators,
                ),
                destination_note: quote.destination?.note,
                warnings: quote.warnings,
              },
            };
          },
        };

        /**
         * The circuit to work from: the build the app read from disk when it sends one, else
         * the circuit RunFrame last ran, which is in the eval worker it keeps in this global.
         */
        const circuitJsonFor = async (request) => {
          const circuitJson =
            typeof request.circuit_json_text === "string"
              ? JSON.parse(request.circuit_json_text)
              : await globalThis.runFrameWorker?.getCircuitJson?.();
          if (!Array.isArray(circuitJson) || circuitJson.length === 0) {
            throw new Error("The circuit has not been rendered yet.");
          }
          return circuitJson;
        };

        window.addEventListener("message", (event) => {
          if (event.source !== window.parent) return;
          const request = event.data;
          if (
            request === null ||
            typeof request !== "object" ||
            request.tscircuit_desktop_type !== REQUEST_TYPE
          ) {
            return;
          }
          const reply = (result) => {
            window.parent.postMessage(
              { tscircuit_desktop_type: RESPONSE_TYPE, request_id: request.request_id, ...result },
              // A page without an origin cannot be addressed by one.
              event.origin === "null" ? "*" : event.origin,
            );
          };
          const make = Object.hasOwn(makers, request.kind) ? makers[request.kind] : null;
          if (make === null) {
            reply({ ok: false, error_message: `Unknown request: ${String(request.kind)}` });
            return;
          }
          circuitJsonFor(request)
            .then((circuitJson) => make(circuitJson, String(request.project_name ?? "circuit")))
            .then(
              (made) => reply({ ok: true, ...made }),
              (error) =>
                reply({
                  ok: false,
                  error_message: error instanceof Error ? error.message : String(error),
                }),
            );
        });
      })();
    </script>
    <script src="./runframe.min.js"></script>
  </body>
</html>
