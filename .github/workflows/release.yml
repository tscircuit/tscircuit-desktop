name: Release

# Builds tscircuit desktop for Apple Silicon Macs.
#
#   - On every push to main it publishes a GitHub release, v<major>.<minor>.<run>.
#     Major and minor come from "version" in package.json; the last number is
#     this workflow's run number, so no commit is needed to bump it.
#   - On a pull request that changes the app or this file it only builds, and
#     keeps the zip as a workflow artifact, so the build can be tried before
#     merging.
#
# Each build is signed with tscircuit's Apple Developer ID and notarized by
# Apple (scripts/sign-macos.sh), so macOS opens a downloaded copy without
# complaint. The credentials are the secrets tscircuit-standalone signs with.
# A pull request from a fork gets no secrets; its build is signed ad hoc, for
# trying out only. A release is never published without a Developer ID.
#
# The app does not update itself yet: the build is made without an update feed,
# and the app says updates are unavailable. See "Releases and automatic
# updates" in the README.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    paths:
      - .github/workflows/release.yml
      - upstream.json
      - renames.json
      - skill.json
      - viewer.json
      - package.json
      - "overlay/**"
      - "patches/**"
      - "branding/**"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mac:
    name: Apple Silicon
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Choose the version
        id: version
        run: |
          base="$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")"
          version="${base}.${GITHUB_RUN_NUMBER}"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            version="${version}-pr.${{ github.event.pull_request.number }}.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version $version"

      # Builds .t3code/ from the pin, renames.json, overlay/ and patches/, and
      # downloads what skill.json and viewer.json name.
      - run: node scripts/setup.ts --no-install

      # From here on use the Node and pnpm versions T3 Code itself asks for.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .t3code/package.json
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: .t3code/package.json
      - run: node scripts/setup.ts

      # GITHUB_REPOSITORY is hidden from the build so that it bakes in no update
      # feed: no release publishes the latest-mac.yml the updater reads.
      - name: Build the app
        run: |
          env -u GITHUB_REPOSITORY node scripts/run.ts vp run dist:desktop:artifact \
            --platform mac --target zip --arch arm64 \
            --build-version "${{ steps.version.outputs.version }}" --verbose

      # The build script signs only when T3 Code's own passkey sign-in is set
      # up, so it leaves the app bundle unsigned: only the program file keeps
      # the signature its linker gave it. Sign the finished app here instead,
      # then package it, since signing changes the files.
      - name: Sign, notarize and package the app
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_TEAM_ID: WUQ9WUY75Z
        run: |
          work="$RUNNER_TEMP/app"
          mkdir -p "$work" out
          zip="$(ls .t3code/release/*.zip)"
          name="$(basename "$zip" .zip)"
          ditto -x -k "$zip" "$work"
          app="$(find "$work" -maxdepth 1 -name '*.app' | head -1)"
          echo "App: $app"

          if [ -n "$MACOS_CERTIFICATE_P12_BASE64" ]; then
            bash scripts/sign-macos.sh "$app" out "$name"
          elif [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            # Ad hoc (no identity): macOS sees one consistent app with our app
            # ID, but asks for confirmation before opening a downloaded copy.
            echo "::warning::No signing secrets here (a pull request from a fork?). This build is signed ad hoc and is not notarized."
            codesign --force --deep --sign - "$app"
            codesign --verify --deep --strict --verbose=2 "$app"
            ditto -c -k --keepParent "$app" "out/$name.zip"
          else
            echo "::error::The signing secrets are missing; refusing to release an app without a Developer ID signature."
            exit 1
          fi
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: tscircuit-desktop-mac-arm64
          path: out/*.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Publish the release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<'NOTES'
          **Install on an Apple Silicon Mac:** download the `.dmg`, open it, and drag tscircuit desktop to Applications.

          This build is signed with tscircuit's Apple Developer ID and notarized by Apple. It does not update itself: download a newer release to update.
          NOTES
          gh release create "v$VERSION" out/*.dmg out/*.zip \
            --target "$GITHUB_SHA" \
            --title "tscircuit desktop $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes
