name: Release

# Builds tscircuit desktop for Apple Silicon Macs, Windows x64 and Linux x64.
#
#   - On every push to main it publishes a GitHub release, one patch number
#     above the release before it: v0.1.61, then v0.1.62. No commit is needed
#     to bump it, and the minor number never moves by itself.
#   - Run by hand on main with "bump" set to "minor", it publishes the first
#     release of the next minor version instead: v0.2.0 after v0.1.x.
#   - On a pull request that changes the app or this file it only builds, and
#     keeps the packages as workflow artifacts, so the build can be tried before
#     merging.
#
# Each Mac release is signed with tscircuit's Apple Developer ID and notarized by
# Apple (scripts/sign-macos.sh), so macOS opens a downloaded copy without
# complaint. The credentials are the secrets tscircuit-standalone signs with.
# A pull request from a fork gets no secrets; its build is signed ad hoc, for
# trying out only. Windows releases use Azure Artifact Signing on main. The Linux
# packages (an AppImage and a .deb) are not signed.
#
# A release build carries this repository's releases as its update feed, and
# each release is published with the files the app's updater reads: latest-mac.yml,
# latest.yml and latest-linux.yml. A pull request's build has a preview version, which gets no
# feed, so it never updates itself. See "Releases and automatic updates" in the
# README.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/workflows/build-windows.yml
      - upstream.json
      - renames.json
      - skill.json
      - viewer.json
      - package.json
      - "overlay/**"
      - "patches/**"
      - "branding/**"
      - "scripts/**"
  workflow_dispatch:
    inputs:
      bump:
        description: "patch: the next release as usual. minor: start the next minor version, such as 0.2.0 after 0.1.x."
        type: choice
        options: [patch, minor]
        default: patch

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tscircuit: ${{ steps.version.outputs.tscircuit }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Runs on main wait for each other (see "concurrency"), so the release
      # this counts from is the one before it.
      - name: Choose the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ inputs.bump || 'patch' }}
        run: |
          tags="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[] | select(.draft | not) | .tag_name')"
          version="$(node scripts/release-version.ts "$BUMP" <<< "$tags")"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            version="${version}-pr.${{ github.event.pull_request.number }}.${GITHUB_RUN_NUMBER}"
          fi
          # The newest tscircuit, which viewer.json asks for. Every build job
          # below is held to it, so all three bundle the version the release's
          # title names.
          tscircuit="$(node scripts/tscircuit-version.ts)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tscircuit=$tscircuit" >> "$GITHUB_OUTPUT"
          echo "Version $version, with tscircuit $tscircuit"

  mac:
    name: Apple Silicon
    runs-on: macos-15
    needs: version
    timeout-minutes: 90
    env:
      VIEWER_TSCIRCUIT_VERSION: ${{ needs.version.outputs.tscircuit }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Builds .t3code/ from the pin, renames.json, overlay/ and patches/, and
      # downloads what skill.json and viewer.json name.
      - run: node scripts/setup.ts --no-install

      # From here on use the Node and pnpm versions T3 Code itself asks for.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .t3code/package.json
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: .t3code/package.json
      - run: node scripts/setup.ts

      # The build takes the update feed from GITHUB_REPOSITORY: the app looks
      # for newer versions in this repository's releases.
      - name: Build the app
        run: |
          node scripts/run.ts vp run dist:desktop:artifact \
            --platform mac --target zip --arch arm64 \
            --build-version "${{ needs.version.outputs.version }}" --verbose

      # The build script signs only when T3 Code's own passkey sign-in is set
      # up, so it leaves the app bundle unsigned: only the program file keeps
      # the signature its linker gave it. Sign the finished app here instead,
      # then package it, since signing changes the files.
      - name: Sign, notarize and package the app
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_TEAM_ID: WUQ9WUY75Z
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          work="$RUNNER_TEMP/app"
          mkdir -p "$work" out
          zip="$(ls .t3code/release/*.zip)"
          name="$(basename "$zip" .zip)"
          ditto -x -k "$zip" "$work"
          app="$(find "$work" -maxdepth 1 -name '*.app' | head -1)"
          echo "App: $app"

          # The build writes latest-mac.yml when it gave the app an update feed.
          # A release must have one, or every copy installed from it is stuck.
          feed=false
          if [ -f .t3code/release/latest-mac.yml ]; then
            feed=true
            echo "The app's update feed (app-update.yml):"
            cat "$app/Contents/Resources/app-update.yml"
            # T3 Code's own download folder would be shared with T3 Code.
            grep -qx 'updaterCacheDirName: tscircuit-desktop-updater' "$app/Contents/Resources/app-update.yml"
          elif [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "::error::The build gave the app no update feed, so this release could not update itself."
            exit 1
          fi

          if [ -n "$MACOS_CERTIFICATE_P12_BASE64" ]; then
            bash scripts/sign-macos.sh "$app" out "$name"
            # The build's latest-mac.yml describes the zip from before signing.
            # The updater refuses a download that differs from it, so write it
            # again for the zip that is published.
            if [ "$feed" = true ]; then
              node scripts/update-manifest.ts write "$VERSION" "out/$name.zip" out/latest-mac.yml
              cat out/latest-mac.yml
            fi
          elif [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            # Ad hoc (no identity): macOS sees one consistent app with our app
            # ID, but asks for confirmation before opening a downloaded copy.
            echo "::warning::No signing secrets here (a pull request from a fork?). This build is signed ad hoc and is not notarized."
            codesign --force --deep --sign - "$app"
            codesign --verify --deep --strict --verbose=2 "$app"
            ditto -c -k --keepParent "$app" "out/$name.zip"
          else
            echo "::error::The signing secrets are missing; refusing to release an app without a Developer ID signature."
            exit 1
          fi
          ls -la out

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: tscircuit-desktop-mac-arm64
          path: |
            out/*.dmg
            out/*.zip
            out/*.yml
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request' && hashFiles('out/*.dmg') != ''
        with:
          name: tscircuit-desktop-mac-arm64-dmg
          path: out/*.dmg
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: tscircuit-desktop-mac-arm64-zip
          path: out/*.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  linux:
    name: Linux x64
    # A fixed release, not ubuntu-latest: the programs built here need at least
    # the C library of the system that built them, so a newer runner would stop
    # the app opening on distributions it opens on today.
    runs-on: ubuntu-24.04
    needs: version
    timeout-minutes: 60
    env:
      VIEWER_TSCIRCUIT_VERSION: ${{ needs.version.outputs.tscircuit }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Builds .t3code/ from the pin, renames.json, overlay/ and patches/, and
      # downloads what skill.json and viewer.json name.
      - run: node scripts/setup.ts --no-install

      # From here on use the Node and pnpm versions T3 Code itself asks for.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .t3code/package.json
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: .t3code/package.json
      - run: node scripts/setup.ts

      # libsecret and ImageMagick are for the build. The rest is what the app
      # needs to open on a runner with no display, for the launch check.
      - name: Install build and launch libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev pkg-config imagemagick \
            xvfb libgtk-3-0t64 libnss3 libasound2t64 libgbm1

      # Asking for the AppImage also builds the .deb. The build takes the update
      # feed from GITHUB_REPOSITORY: the app looks for newer versions in this
      # repository's releases.
      - name: Build the app
        run: |
          node scripts/run.ts vp run dist:desktop:artifact \
            --platform linux --target AppImage --arch x64 \
            --build-version "${{ needs.version.outputs.version }}" --verbose

      - name: Check the packages
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          release="$GITHUB_WORKSPACE/.t3code/release"
          ls -la "$release"
          appimage="$release/tscircuit-desktop-$VERSION-x86_64.AppImage"
          deb="$release/tscircuit-desktop-$VERSION-amd64.deb"

          # Under T3 Code's names the .deb would replace an installed T3 Code.
          package="$(dpkg-deb -f "$deb" Package)"
          if [ "$package" != tscircuit-desktop ]; then
            echo "::error::The .deb is named $package, not tscircuit-desktop."
            exit 1
          fi
          dpkg-deb -c "$deb" | grep ' \./usr/share/applications/tscircuit-desktop-app\.desktop$'

          chmod +x "$appimage"
          (cd "$RUNNER_TEMP" && "$appimage" --appimage-extract >/dev/null)
          app="$RUNNER_TEMP/squashfs-root"

          # The build writes latest-linux.yml when it gave the app an update
          # feed. A release must have one, or every copy installed from it is
          # stuck. A build with a feed keeps its downloads apart from T3 Code's.
          if [ -f "$release/latest-linux.yml" ]; then
            cat "$app/resources/app-update.yml"
            grep -qx 'updaterCacheDirName: tscircuit-desktop-updater' "$app/resources/app-update.yml"
            dpkg-deb --fsys-tarfile "$deb" \
              | tar -xO './opt/tscircuit desktop/resources/app-update.yml' \
              | grep -qx 'updaterCacheDirName: tscircuit-desktop-updater'
          elif [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "::error::The build gave the app no update feed, so this release could not update itself."
            exit 1
          fi

          # A build can package fine and still not open. T3 Code's launch check
          # starts the packaged app and waits for a thread to show.
          cd .t3code
          xvfb-run -a node scripts/smoke-desktop-app.ts \
            --artifacts-dir "$RUNNER_TEMP/launch-check" \
            --executable "$app/tscircuit-desktop-app"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: tscircuit-desktop-linux-launch-check
          path: ${{ runner.temp }}/launch-check
          if-no-files-found: ignore
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: tscircuit-desktop-linux-x64
          # latest-linux.yml is what the app's updater reads. The build writes
          # it only for a version that gets an update feed.
          path: |
            .t3code/release/*.AppImage
            .t3code/release/*.deb
            .t3code/release/latest-linux.yml
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  windows-preview:
    if: github.ref != 'refs/heads/main' || github.event_name == 'pull_request'
    needs: version
    uses: ./.github/workflows/build-windows.yml
    with:
      version: ${{ needs.version.outputs.version }}
      tscircuit: ${{ needs.version.outputs.tscircuit }}
      sign: false

  windows:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: version
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/build-windows.yml
    with:
      version: ${{ needs.version.outputs.version }}
      tscircuit: ${{ needs.version.outputs.tscircuit }}
      sign: true

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [version, mac, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: tscircuit-desktop-mac-arm64
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: tscircuit-desktop-windows-x64
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: tscircuit-desktop-linux-x64
          path: out
      # An update whose size or hash differs from its manifest is refused by
      # every copy of the app, so nothing is published unless they agree.
      - name: Check the update manifests against the packages
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: node scripts/update-manifest.ts check "$VERSION" out/latest-mac.yml out/latest.yml out/latest-linux.yml

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          TSCIRCUIT: ${{ needs.version.outputs.tscircuit }}
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<'NOTES'
          **Install on an Apple Silicon Mac:** download the `.dmg`, open it, and drag tscircuit desktop to Applications.

          **Install on Windows x64:** download and run the `.exe` installer.

          **Install on Linux x64:** install the `.deb` on Debian or Ubuntu, or download the `.AppImage`, make it executable and run it.

          The Mac app is signed and notarized by Apple. The Windows installer is signed by tscircuit Inc through Azure Artifact Signing. The Linux packages are not signed.

          The app updates itself from these releases. A copy that says updates are unavailable was installed before that worked: install a newer release by hand once.
          NOTES
          shopt -s nullglob
          files=(out/*.dmg out/*.zip out/*.exe out/*.AppImage out/*.deb out/*.yml out/*.blockmap)
          gh release create "v$VERSION" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "tscircuit desktop $VERSION (tscircuit $TSCIRCUIT)" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes
