name: Release Motorcontrol Desktop
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: motorcontrol-desktop-release
  cancel-in-progress: false
jobs:
  source:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Resolve the current motorcontrol main commit
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api repos/tscircuit/motorcontrol/git/ref/heads/main --jq .object.sha)
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
  build:
    needs: source
    strategy:
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/motorcontrol
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r desktop/requirements.txt
      - run: python -m unittest discover -s desktop -p "test_*.py"
      - run: python desktop/build.py
      - if: runner.os == 'macOS'
        run: |
          "build/desktop/Motorcontrol Desktop.app/Contents/MacOS/Motorcontrol Desktop" --smoke-test
          ditto -c -k --keepParent "build/desktop/Motorcontrol Desktop.app" build/motorcontrol.zip
      - if: runner.os == 'Windows'
        run: |
          $exe = 'build/desktop/Motorcontrol Desktop.exe'
          $p = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Smoke test failed." }
          Copy-Item $exe build/motorcontrol.exe
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ runner.os }}
          path: build/motorcontrol.*
          if-no-files-found: error
          retention-days: 2
  sign-mac:
    needs: build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: build-macOS
          path: unsigned
      - run: ditto -x -k unsigned/motorcontrol.zip unsigned
      - name: Sign, notarize and staple the application and DMG
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_TEAM_ID: WUQ9WUY75Z
        run: bash scripts/sign-macos.sh "unsigned/Motorcontrol Desktop.app" signed Motorcontrol-macOS-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: signed-macOS
          path: signed/Motorcontrol-macOS-arm64.dmg
          if-no-files-found: error
  sign-windows:
    needs: build
    runs-on: windows-2025
    permissions:
      contents: read
      id-token: write
    environment: windows-signing
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: build-Windows
          path: unsigned
      - run: ./overlay/scripts/tscircuit-windows/install-signing.ps1
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Sign and verify the executable
        env:
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        run: |
          Rename-Item unsigned/motorcontrol.exe Motorcontrol-Windows-x64.exe
          ./overlay/scripts/tscircuit-windows/sign.ps1 -Path unsigned/Motorcontrol-Windows-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: signed-Windows
          path: unsigned/Motorcontrol-Windows-x64.exe
          if-no-files-found: error
  release:
    needs: [source, sign-mac, sign-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: signed-*
          path: release
          merge-multiple: true
      - name: Publish the verified binaries
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
        run: |
          test -s release/Motorcontrol-macOS-arm64.dmg
          test -s release/Motorcontrol-Windows-x64.exe
          cd release
          sha256sum Motorcontrol-* > SHA256SUMS.txt
          gh release create "motorcontrol-${SOURCE_SHA:0:12}" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --latest=false --title "Motorcontrol Desktop · ${SOURCE_SHA:0:12}" \
            --notes "Native USB dashboards and NEMA17 firmware updater. Built from https://github.com/tscircuit/motorcontrol/commit/$SOURCE_SHA. Download the DMG for Apple silicon or the executable for Windows x64." \
            Motorcontrol-macOS-arm64.dmg Motorcontrol-Windows-x64.exe SHA256SUMS.txt
